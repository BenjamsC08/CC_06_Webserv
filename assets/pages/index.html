<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rat Services - Home</title>
    <link rel="stylesheet" type="text/css" href="/css/{{THEME_FILENAME}}">
</head>
<body>

    <div class="window">
        <div class="title-bar">
            <span>Rat Services v1.0</span>
            <div class="title-bar-controls">
                <button>_</button>
                <button>&#9633;</button>
                <button>X</button>
            </div>
        </div>
        
        <div class="menu-bar">
            <span>File</span>
            <span>Edit</span>
            <span>View</span>
            <span>Help</span>
        </div>

        <div class="content">
            <h2>Welcome to Rat Services</h2>
            <p>Quality rodent solutions since 1998.</p>

            <div style="margin-bottom: 15px;">
                <span style="margin-right: 10px;">Theme:</span>
                
                <a href="/set-theme?theme=light" class="win-button">
                    Light Mode
                </a>

                <a href="/set-theme?theme=dark" class="win-button">
                    Dark Mode
                </a>
            </div>

            <div style="border-top: 1px solid #808080; margin-top: 15px; padding-top: 10px;">
                <form action="/upload/" method="POST" enctype="multipart/form-data">
                    <label for="rat-file" style="display: block; margin-bottom: 5px;">
                        Submit Rat Data:
                    </label>
                    <input type="file" id="rat-file" name="file"
                           style="margin-bottom: 10px; font-size: 10px;">
                    <br>
                    <button type="submit" class="win-button">Upload</button>
                </form>
            </div>

            <a href="about.html" class="win-button">About Us</a>
            <a href="gallery.html" class="win-button">Our Gallery</a>

            <ul>
                <li>Cheese Consulting</li>
                <li>Maze Optimization</li>
                <li>Whiskers & Tech Support</li>
            </ul>
        </div>
    </div>

    <div class="taskbar">
        <div class="start-button">
            Start
        </div>
    </div>

</body>
</html>
